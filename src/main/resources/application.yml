spring:
  application:
    name: bookwise
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookwise?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:bookwise}
    password: ${DB_PASSWORD:bookwise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
